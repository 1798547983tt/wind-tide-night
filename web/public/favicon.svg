<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 风与潮之夜: a crescent moon over a breaking wave (brand-mark.tsx). -->
  <style>
    .moon { fill: #b5223a } .tide { stroke: #4fa3c7 } .sun { fill: #f2c46b }
    @media (prefers-color-scheme: dark) {
      .moon { fill: #e0435a } .tide { stroke: #6fd9d1 }
    }
  </style>
  <mask id="bite">
    <rect width="32" height="32" fill="#fff"/>
    <circle cx="20.6" cy="12.2" r="9.6" fill="#000"/>
  </mask>
  <circle class="moon" cx="15.5" cy="15.5" r="12" mask="url(#bite)"/>
  <path class="tide" d="M4.5 22.5c3-2.4 5.6-2.6 8 0s5.4 2.4 8 0 5.2-2.6 7.5-.4" fill="none" stroke-width="2.2" stroke-linecap="round"/>
  <circle class="sun" cx="24.5" cy="7" r="1.3"/>
</svg>
