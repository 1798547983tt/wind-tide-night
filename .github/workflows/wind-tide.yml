# wind-tide: checks the fork on every push to its work branch, wind-tide
# (docs/adr/0005), including its backend tests on the oldest and newest
# supported MySQL and PostgreSQL, then publishes the site image to GitHub
# Container Registry. Only the wind-tide branch publishes the image, so a
# manual run on another branch cannot replace what the server pulls.
# Upstream's own workflows are left as they are; they only run on tags or by
# hand.
name: Wind & Tide

on:
  push:
    branches: [wind-tide]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wind-tide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend vet, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet root module
        run: go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Test root, relaykit, and tokenkit modules
        run: make test

  databases:
    name: Wind & Tide tests on ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MySQL 5.7 and PostgreSQL 9.6 (oldest supported)
            mysql: mysql:5.7
            postgres: postgres:9.6
          - name: MySQL 8.4 and PostgreSQL 18
            mysql: mysql:8.4
            postgres: postgres:18
    services:
      mysql:
        image: ${{ matrix.mysql }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      postgres:
        image: ${{ matrix.postgres }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      GOWORK: 'off'
      WT_TEST_MYSQL_DSN: root@tcp(127.0.0.1:3306)/mysql?parseTime=true&charset=utf8mb4
      WT_TEST_POSTGRES_DSN: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      # The router tests check the Discord-only guard and the generation
      # routes' rate limit; the root package checks the emergency-login CLI.
      - name: Test on SQLite, MySQL, and PostgreSQL
        run: go test ./controller/ ./router/ . -run '^TestWt' -count=1 -v

  frontend:
    name: Frontend typecheck, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The lint step compares against the upstream commit the fork
          # branched from.
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Upstream's tree is not lint-clean, so only the files the fork added or
      # changed since it branched from upstream are linted. Move
      # WT_UPSTREAM_BASE to the new upstream commit when upstream is merged in.
      - name: Lint the fork's frontend code
        env:
          WT_UPSTREAM_BASE: 633b4c5b190dc1af99a2814391354d86948e7943
        run: |
          files=$(git diff --name-only --relative --diff-filter=ACMR "$WT_UPSTREAM_BASE" -- 'src/*.ts' 'src/*.tsx' | grep -v '^src/routeTree.gen.ts$' || true)
          if [ -z "$files" ]; then
            echo "No frontend files changed since the upstream base."
            exit 0
          fi
          ./node_modules/.bin/oxlint -c .oxlintrc.json $files

      - name: Test
        run: bun run test

  image:
    name: Build and push the site image
    needs: [backend, databases, frontend]
    if: github.ref == 'refs/heads/wind-tide'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Write VERSION
        run: echo "wind-tide-${GITHUB_SHA::7}" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
